version: '3.8'

services:
  chroma:
    # Spring AI 1.1.2 使用 v2 API，需要最新 Chroma
    image: chromadb/chroma:latest
    container_name: chinabuddy-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
      - ALLOW_RESET=true
    restart: unless-stopped

volumes:
  chroma-data:
